[package]
name = "yolo-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
burn = { version = "0.20.0-pre.6", default-features = false, features = [
    "ndarray",
    "webgpu",
] }
burn-store = { version = "0.20.0-pre.6", default-features = false, features = [
    "burnpack",
] }

log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

# Wasm dependencies
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
wasm-logger = "0.2"
web-time = "1.1.0"
js-sys = "0.3"
# https://github.com/rust-random/getrandom/#webassembly-support
getrandom = { version = "0.3.3", default-features = false, features = [
    "wasm_js",
] }

[build-dependencies]
burn-import = { version = "0.20.0-pre.6", default-features = false, features = [
    "onnx",
] }
